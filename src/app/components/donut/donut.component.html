<div class="donut">

  <!-- what is left to do and the pace, and below how long that takes -->
  <div class="progress-numbers" [ngStyle]="{ color: darkMode() ? 'white' : 'black' }">
    <div>
      {{ left() }} {{ leftLabel() }}
      @if (perMinute() > 0) {
        · {{ perMinute() }} / min
      }
    </div>
    <div>{{ timeLeft() }}</div>
  </div>

  <div class="progress-circle" [ngClass]="{ over50: percent() > 50 }">
    <div class="left-half-clipper">
      <div class="first50-bar"></div>
      <div class="value-bar" [ngStyle]="{ transform: 'rotate(' + (360 * percent() / 100) + 'deg)' }"></div>
    </div>
  </div>

</div>
